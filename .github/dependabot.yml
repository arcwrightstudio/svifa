version: 2

# A new release waits a week before it is proposed, so one that turns out to be compromised is usually withdrawn first.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tools:
        dependency-type: development
    ignore:
      # Node's types stay on a long-term support line, so code that needs a newer Node than CI tests on does not type check
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]

  - package-ecosystem: npm
    directories: [/examples/vite, /examples/next, /examples/vue, /examples/nuxt, /examples/sveltekit, /examples/solid, /examples/astro]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      examples:
        patterns: ['*']
    ignore:
      # Node's types stay on a long-term support line, as above
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    labels: [dependencies]

  # Each Angular release names the TypeScript versions it builds with, so the Angular example's TypeScript moves with Angular
  - package-ecosystem: npm
    directory: /examples/angular
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      angular-example:
        patterns: ['*']
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
    labels: [dependencies]
