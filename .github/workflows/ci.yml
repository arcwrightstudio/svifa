name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to a pull request replaces its run under way; every push to main is checked
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the newest Node release, and the newest long-term support release
        node: [latest, lts/*]
    steps:
      # the name for the branch checkout starts its repository with (unset, git prints a hint about its default)
      - run: git config --global init.defaultBranch main
      # each action is pinned to the commit of its release, which Dependabot keeps current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run lint
      # every source file opens with the licence and copyright lines LICENSE gives (SPDX); CONTRIBUTING.md says how
      - if: matrix.node == 'latest'
        run: |
          missing="$(git ls-files '*.ts' '*.tsx' '*.mjs' '*.js' '*.css' '*.html' '*.vue' '*.svelte' '*.astro' | while read -r file; do
            head -n 4 "$file" | grep -q 'SPDX-License-Identifier: MIT' && head -n 4 "$file" | grep -q 'Copyright (c) 2026 Arcwright Studio' || echo "$file"
          done)"
          if [ -n "$missing" ]; then
            echo "::error::These files do not open with the licence and copyright lines: $missing"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # how much of the source the tests run (measured in Chromium); below the floors in scripts/coverage.mjs it fails
      - if: matrix.node == 'latest'
        run: npm run coverage
      - run: npm run check:package

  # every example, installed from the package as it would be published, built with its framework's own tool and driven in a browser
  examples:
    name: examples
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:examples

  # each framework entry, tested against the oldest version of its framework that package.json supports
  oldest:
    name: oldest frameworks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:oldest

  # every commit of a pull request certifies the Developer Certificate of Origin (CONTRIBUTING.md) with a sign-off naming its author;
  # Dependabot's updates are made by a tool, not a person
  sign-off:
    name: sign-off
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$commit")"
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -qxF "$author"; then
              echo "::error::Commit $(git show -s --format=%h "$commit") has no Signed-off-by line naming its author, $author"
              status=1
            fi
          done
          exit $status

  # the newest version npm serves, built again here from its release tag, is byte for byte the package on npm
  reproducible:
    name: reproducible build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          # built from nothing a run before could have left
          package-manager-cache: false
      - run: |
          # the newest release tag whose version npm serves (one staged for approval is not served yet)
          for tag in $(git tag --list 'v*' --sort=-v:refname); do
            if npm view "@arcwrightstudio/svifa@${tag#v}" version > /dev/null 2>&1; then break; fi
            tag=''
          done
          if [ -z "$tag" ]; then echo "::error::No release tag names a version npm serves"; exit 1; fi
          version="${tag#v}"
          git worktree add --detach "$RUNNER_TEMP/release" "$tag"
          cd "$RUNNER_TEMP/release"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP" --silent > /dev/null
          cd "$RUNNER_TEMP"
          mkdir built published
          npm pack "@arcwrightstudio/svifa@$version" --pack-destination published --silent > /dev/null
          tar -xzf "arcwrightstudio-svifa-$version.tgz" -C built
          tar -xzf "published/arcwrightstudio-svifa-$version.tgz" -C published
          diff -r built/package published/package
          echo "$tag, built again from its tag, is byte for byte the package npm serves"

  # a pull request may not bring in a dependency with a known vulnerability or a licence that does not allow open use
  dependencies:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
