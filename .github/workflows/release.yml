name: Release

# Publishing a GitHub release named after the version (v1.2.3) checks everything again and stages that version on npm with
# provenance, for a maintainer to approve. npm trusts this workflow by OpenID Connect, so it needs no token.
on:
  release:
    types: [published]

permissions: {}

# one release at a time, and never one cut short
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: stage on npm
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
      id-token: write # to sign in to npm by OpenID Connect and sign the provenance statement
    steps:
      # the name for the branch checkout starts its repository with (unset, git prints a hint about its default)
      - run: git config --global init.defaultBranch main
      # each action is pinned to the commit of its release, which Dependabot keeps current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          # a release installs fresh, never from a cache another run could have filled
          package-manager-cache: false
      - name: Check the release is named after this version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The release is $GITHUB_REF_NAME, but package.json is at $version"
            exit 1
          fi
      - run: npm ci
      # no release while any installed package, a development tool included, has a known vulnerability (SECURITY.md, Dependencies)
      - run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium firefox webkit
      # npm runs every check before it stages (prepublishOnly): types, the build, the tests and the package checks
      - run: npm stage publish --provenance
