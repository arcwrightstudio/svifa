name: Release

# Publishing a GitHub release named after the version (v1.2.3) checks everything again and stages that version on npm with
# provenance: npm shows that it was built here, from this repository, by this workflow. It goes live once a maintainer approves it
# on npmjs.com (the package's Staged Packages tab, with two-factor authentication). npm trusts this workflow by OpenID Connect, so
# no token is kept anywhere.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      # the name for the branch checkout starts its repository with (unset, git prints a hint about its default)
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the release is named after this version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The release is $GITHUB_REF_NAME, but package.json is at $version"
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # npm runs every check before it stages (prepublishOnly): types, the build, the tests and the package checks
      - run: npm stage publish --provenance
