name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # weekly too, so a query added to CodeQL meets what is already on main
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

# a newer push to a pull request replaces its run under way; every push to main is analysed
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      # to upload what the analysis found
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # the workflows, and the source with its tests, scripts and examples
        language: [actions, javascript-typescript]
    steps:
      # the name for the branch checkout starts its repository with (unset, git prints a hint about its default)
      - run: git config --global init.defaultBranch main
      # each action is pinned to the commit of its release, which Dependabot keeps current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          # nothing is compiled: CodeQL reads the source as it is
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
